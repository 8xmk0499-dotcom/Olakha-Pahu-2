<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="pencilBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="brushHandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Playful ink splatters & doodles in background -->
  <circle cx="90" cy="110" r="18" fill="#FDE047" opacity="0.8" />
  <circle cx="420" cy="90" r="24" fill="#38BDF8" opacity="0.8" />
  <circle cx="440" cy="390" r="16" fill="#4ADE80" opacity="0.8" />
  <circle cx="80" cy="400" r="22" fill="#F43F5E" opacity="0.8" />

  <!-- Artist Palette in center-left -->
  <g filter="url(#glow)">
    <path d="M 230 110 C 330 90, 420 170, 410 270 C 405 320, 365 350, 325 340 C 295 330, 275 350, 280 380 C 285 410, 245 430, 210 420 C 130 400, 100 290, 120 200 C 140 130, 180 110, 230 110 Z" fill="#FFFBEB" stroke="#FDE68A" stroke-width="8" />
    
    <!-- Palette Paint Blobs -->
    <circle cx="180" cy="160" r="22" fill="#EF4444" />
    <circle cx="240" cy="140" r="20" fill="#F59E0B" />
    <circle cx="305" cy="155" r="22" fill="#10B981" />
    <circle cx="360" cy="205" r="20" fill="#3B82F6" />
    <circle cx="365" cy="270" r="22" fill="#8B5CF6" />
    <!-- Thumb hole -->
    <ellipse cx="170" cy="350" rx="26" ry="32" fill="#8B5CF6" opacity="0.6" />
  </g>

  <!-- Colorful Crossing Pencil & Brush Doodle -->
  <g filter="url(#glow)" transform="rotate(-15 256 256)">
    <!-- Pencil -->
    <g transform="translate(160, 60)">
      <!-- Eraser -->
      <path d="M 55 0 L 85 0 C 95 0, 100 8, 100 20 L 40 20 C 40 8, 45 0, 55 0 Z" fill="#FB7185" />
      <rect x="40" y="20" width="60" height="15" fill="#E2E8F0" />
      <!-- Body -->
      <rect x="40" y="35" width="60" height="230" fill="url(#pencilBody)" />
      <!-- Lead Tip -->
      <polygon points="40,265 100,265 70,335" fill="#FDE68A" />
      <polygon points="62,315 78,315 70,335" fill="#1E293B" />
      <!-- Pencil stripe lines -->
      <line x1="60" y1="35" x2="60" y2="265" stroke="#D97706" stroke-width="3" />
      <line x1="80" y1="35" x2="80" y2="265" stroke="#D97706" stroke-width="3" />
    </g>
  </g>

  <!-- Big joyful cartoon eyes (👀) on palette -->
  <g filter="url(#glow)">
    <!-- Left Eye -->
    <ellipse cx="230" cy="245" rx="24" ry="28" fill="#FFFFFF" stroke="#1E293B" stroke-width="5" />
    <ellipse cx="236" cy="245" rx="13" ry="16" fill="#1E293B" />
    <circle cx="240" cy="239" r="5" fill="#FFFFFF" />

    <!-- Right Eye -->
    <ellipse cx="285" cy="240" rx="24" ry="28" fill="#FFFFFF" stroke="#1E293B" stroke-width="5" />
    <ellipse cx="291" cy="240" rx="13" ry="16" fill="#1E293B" />
    <circle cx="295" cy="234" r="5" fill="#FFFFFF" />

    <!-- Happy Smile -->
    <path d="M 235 285 Q 260 310 285 285" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round" />
    <!-- Rosy Cheeks -->
    <ellipse cx="210" cy="275" rx="10" ry="6" fill="#FDA4AF" />
    <ellipse cx="305" cy="270" rx="10" ry="6" fill="#FDA4AF" />
  </g>
</svg>
